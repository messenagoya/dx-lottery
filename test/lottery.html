 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>抽選ページ</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #eef7ff;
  padding: 20px;
}

button {
  padding: 20px 45px;
  border-radius: 14px;
  border: none;
  background: #007bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  transition: transform 0.1s ease;
}
button:hover { transform: scale(1.05); }

/* ▼ ルーレット */
.rouletteContainer {
  width:240px;
  height:240px;
  margin:20px auto;
  position:relative;
  display:none;
}
.roulettePointer {
  display:none;
  width:0; height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:25px solid gold;
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
}
.rouletteWheel {
  width:100%; height:100%; border-radius:50%;
  background:conic-gradient(
    #c00 0deg 30deg, #000 30deg 60deg,
    #c00 60deg 90deg, #000 90deg 120deg,
    #c00 120deg 150deg, #000 150deg 180deg,
    #c00 180deg 210deg, #000 210deg 240deg,
    #c00 240deg 270deg, #000 270deg 300deg,
    #c00 300deg 330deg, #000 330deg 360deg
  );
  border:8px solid gold;
  box-shadow:none;
  transform:rotate(0deg);
}
.rouletteCenter {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  font-size:22px;
  font-weight:bold;
  color:#ffd700;
  text-shadow:0 0 5px #000;
  display:none;
}

/* ▼ スロット */
.slotMachine { display:none; justify-content:center; gap:15px; margin:20px; }
.reel {
  width: clamp(90px, 25vw, 130px);
  height: clamp(120px, 30vw, 160px);

  background:
    radial-gradient(circle,#fff,#ccc,#111);

  color:#ffd700;

  font-size:
    clamp(32px, 9vw, 52px);

  font-weight:900;

  border-radius:16px;
  border:6px solid gold;

  display:flex;
  justify-content:center;
  align-items:center;

  text-shadow:
    0 0 5px #000,
    0 0 12px gold;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}
.spinAnim { animation:reelSpin 0.18s linear infinite; }
@keyframes reelSpin { 0%{transform:translateY(0);} 100%{transform:translateY(-15px);} }

/* =========================
   ▼ 派手なガチャガチャ
========================= */

.gachaMachine {
  width: min(88vw, 360px);
  height: 430px;
  margin: 25px auto;
  position: relative;
  transform-origin: center bottom;
}

/* ガチャ本体が激しく揺れる */
.gachaShake {
  animation: gachaShake 0.12s linear infinite;
}

@keyframes gachaShake {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }

  25% {
    transform: translate(-7px, 3px) rotate(-2deg);
  }

  50% {
    transform: translate(7px, -3px) rotate(2deg);
  }

  75% {
    transform: translate(-5px, -2px) rotate(-1deg);
  }

  100% {
    transform: translate(0, 0) rotate(0deg);
  }
}

/* 透明ドーム */
.gachaDome {
  width: 300px;
  height: 300px;

  max-width: 82vw;
  max-height: 82vw;

  background:
    radial-gradient(
      circle at 40% 30%,
      rgba(255,255,255,0.95),
      rgba(135,206,250,0.65) 55%,
      rgba(0,123,255,0.35)
    );

  border: 8px solid #1976d2;
  border-radius: 50%;

  margin: 0 auto;

  position: relative;
  overflow: hidden;

  box-shadow:
    inset 0 0 25px white,
    0 0 20px #2196f3,
    0 10px 20px rgba(0,0,0,0.25);
}

/* カプセル */
#gachaCapsules .capsule {
  width: 44px;
  height: 44px;

  border-radius: 50%;

  position: absolute;

  border: 4px solid white;

  box-shadow:
    0 4px 8px rgba(0,0,0,0.35),
    inset 0 0 8px rgba(255,255,255,0.8);
}

/* カプセルを激しく跳ねさせる */
.capsuleShuffle {
  animation:
    capsuleShuffle 0.32s
    ease-in-out infinite alternate;
}

@keyframes capsuleShuffle {

  0% {
    transform:
      translate(-18px, 12px)
      rotate(0deg)
      scale(1);
  }

  25% {
    transform:
      translate(22px, -20px)
      rotate(120deg)
      scale(1.1);
  }

  50% {
    transform:
      translate(-10px, -30px)
      rotate(240deg)
      scale(0.9);
  }

  75% {
    transform:
      translate(28px, 15px)
      rotate(360deg)
      scale(1.15);
  }

  100% {
    transform:
      translate(-25px, 25px)
      rotate(540deg)
      scale(1);
  }
}

/* 出口 */
.gachaExit {
  width: 130px;
  height: 70px;

  background:
    linear-gradient(
      #555,
      #222
    );

  margin: 10px auto;

  border: 6px solid gold;
  border-radius: 15px;

  position: relative;

  box-shadow:
    inset 0 0 15px black,
    0 0 15px gold;
}

/* 当選カプセル落下 */
.gachaWinnerCapsule {
  z-index: 100;

  animation:
    capsuleDrop 0.9s
    cubic-bezier(.3,.8,.4,1)
    forwards !important;
}

@keyframes capsuleDrop {

  0% {
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  60% {
    transform:
      translateY(210px)
      rotate(540deg)
      scale(1.25);
  }

  80% {
    transform:
      translateY(245px)
      rotate(650deg)
      scale(1.45);
  }

  100% {
    transform:
      translateY(235px)
      rotate(720deg)
      scale(1.35);
  }
}

/* =========================
   ▼ ガラガラ福引き
========================= */

.fukubikiMachine {
  width: min(94vw, 420px);
  height: 430px;
  margin: 25px auto;
  position: relative;
}

/* 台 */
.garaStand {
  width: 360px;
  max-width: 90vw;
  height: 300px;
  margin: 0 auto;
  position: relative;
}

/* 回転する抽選器 */
.garaDrum {
  width: 260px;
  height: 260px;

  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%) rotate(0deg);

  background:
    linear-gradient(
      135deg,
      #ffd700,
      #ff9800,
      #ff5722,
      #ffd700
    );

  /* 八角形 */
  clip-path: polygon(
    30% 0%,
    70% 0%,
    100% 30%,
    100% 70%,
    70% 100%,
    30% 100%,
    0% 70%,
    0% 30%
  );

  border-radius: 20px;

  box-shadow:
    0 0 15px gold,
    0 0 30px orange;

  transform-origin: center;
}

/* 中央の「福」 */
.garaCenter {
  position: absolute;
  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 90px;
  height: 90px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #d50000;
  color: white;

  font-size: 52px;
  font-weight: 900;

  border: 6px solid white;

  box-shadow:
    0 0 20px white,
    0 0 30px gold;
}

/* 軸 */
.garaAxis {
  position: absolute;

  width: 330px;
  height: 16px;

  top: 132px;
  left: 50%;

  transform: translateX(-50%);

  background: #5d4037;

  border-radius: 10px;

  z-index: -1;
}

/* 高速回転 */
.garaSpinFast {
  animation:
    garaSpinFast 0.35s linear infinite;
}

@keyframes garaSpinFast {

  from {
    transform:
      translateX(-50%)
      rotate(0deg);
  }

  to {
    transform:
      translateX(-50%)
      rotate(360deg);
  }
}

/* 減速 */
.garaSlowDown {
  animation:
    garaSlowDown 1.6s
    cubic-bezier(.1,.7,.2,1)
    forwards;
}

@keyframes garaSlowDown {

  0% {
    transform:
      translateX(-50%)
      rotate(0deg);
  }

  70% {
    transform:
      translateX(-50%)
      rotate(900deg);
  }

  90% {
    transform:
      translateX(-50%)
      rotate(1040deg);
  }

  100% {
    transform:
      translateX(-50%)
      rotate(1080deg);
  }
}

/* 停止時ガタン */
.garaStopShock {
  animation:
    garaStopShock 0.4s ease-out;
}

@keyframes garaStopShock {

  0% {
    transform:
      translateX(-50%)
      rotate(1080deg)
      scale(1);
  }

  30% {
    transform:
      translateX(-50%)
      rotate(1065deg)
      scale(1.08);
  }

  60% {
    transform:
      translateX(-50%)
      rotate(1090deg)
      scale(0.95);
  }

  100% {
    transform:
      translateX(-50%)
      rotate(1080deg)
      scale(1);
  }
}

/* 玉受け */
.garaTray {
  width: 180px;
  height: 90px;

  margin: 5px auto;

  position: relative;

  background: #333;

  border: 6px solid gold;
  border-radius: 15px;

  box-shadow:
    inset 0 0 15px #000,
    0 0 15px gold;
}

/* 当選玉 */
.garaWinnerBall {
  display: none;

  width: 65px;
  height: 65px;

  position: absolute;

  top: -90px;
  left: 50%;

  margin-left: -32px;

  border-radius: 50%;

  border: 5px solid white;

  box-shadow:
    0 0 15px white,
    0 0 30px gold;
}

/* 玉がポンッと落ちる */
.garaBallDrop {
  display: block;

  animation:
    garaBallDrop 0.8s
    cubic-bezier(.25,.8,.3,1.25)
    forwards;
}

@keyframes garaBallDrop {

  0% {
    transform:
      translateY(-80px)
      scale(0.5);

    opacity: 0;
  }

  55% {
    transform:
      translateY(85px)
      scale(1.25);

    opacity: 1;
  }

  75% {
    transform:
      translateY(55px)
      scale(0.9);
  }

  100% {
    transform:
      translateY(70px)
      scale(1.1);

    opacity: 1;
  }
}
/* 抽選画面を展示会向けに大型化 */

h1{
  font-size: clamp(42px, 8vw, 64px);

}

p{

#start{

#staffConfirm{

 #retryTest{

  min-height:80px;
  margin-top:20px;
  font-size:28px;
  font-weight:bold;
  background:#6c757d;
}
#result{
  margin-top:30px !important;
  font-size: clamp(42px, 8vw, 64px) !important;
  font-weight:bold;
  color:#ff5722;
  line-height:1.4;
  text-shadow:
    0 0 10px gold,
    0 0 20px gold,
    0 0 30px gold;
}

.rouletteCenter{
  font-size: clamp(26px, 5vw, 38px);
}
#hotBanner,#rareBanner { margin-top:10px; display:none; }
/* ▼ 当選結果の登場演出 */
@keyframes winnerPop {
  0% {
    transform: scale(0.3);
    opacity: 0;
  }
  60% {
    transform: scale(1.15);
    opacity: 1;
  }
  100% {
    transform: scale(1);
  }
}

.winnerResult {
  font-size: clamp(48px, 11vw, 90px);
  font-weight: 900;
  color: #ff5722;
  line-height: 1.3;
  animation: winnerPop 0.8s ease-out;
  text-shadow:
    0 0 10px white,
    0 0 20px gold,
    0 0 35px orange;
}

/* ▼ 紙吹雪 */
.confetti {
  position: fixed;
  top: -20px;
  width: 12px;
  height: 20px;
  pointer-events: none;
  z-index: 9999;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% {
    transform:
      translateY(-20px)
      rotate(0deg);
  }

  100% {
    transform:
      translateY(110vh)
      rotate(900deg);
  }
}

<script type="module">
/* ▼ Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, addDoc, updateDoc, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBh1hBHGUJmYyyLq-CIRRuWJiDDb5xZpCM",
  authDomain:"dx-lottery.firebaseapp.com",
  projectId:"dx-lottery",

  messagingSenderId:"13800927311",

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ▼ 今回の抽選情報 */
let currentSurveyDocRef = null;
let currentEntryNumber = null;
let currentPrize = "";
let currentStockId = "";
/* ▼ 抽選中フラグ */
let drawing = false;

const prizeData = [
  {
    id: "microSD",
    name: "microSDカード"
  },
  {
    id: "bottle",
    name: "ハイドロフラスク水筒"
  },
  {
    id: "tote",
    name: "付箋布バッグ"
  },
  {
    id: "memo500",
    name: "microSD型メモ帳"
  },
  {
    id: "memo100",
    name: "microSD型付箋"
  }
];
 
/* ▼ 抽選済みなら入口へ戻す */
function checkAlreadyDrawn(){
  if(sessionStorage.getItem("drawCompleted") === "true"){
    location.replace("index.html");
  }
}

checkAlreadyDrawn();

/* ブラウザの戻る・進むで復元された場合にも確認 */
window.addEventListener("pageshow", () => {
  checkAlreadyDrawn();
});

/* ▼ 在庫取得 */
async function getStock(id){
  const s = await getDoc(doc(db,"stock_test",id));
  return s.exists()? s.data().count : 0;
}


/* ▼ 在庫数に比例して景品を選び、1個予約する */
async function reserveWeightedPrize(){

  return await runTransaction(db, async (transaction) => {

    const stockList = [];

    for(const item of prizeData){

      const stockRef = doc(db,"stock_test",item.id);
      const stockSnap = await transaction.get(stockRef);

      if(!stockSnap.exists()){
        continue;
      }

      const data = stockSnap.data();

      const count = Number(data.count || 0);
      const reserved = Number(data.reserved || 0);

      const available = Math.max(0, count - reserved);

      if(available > 0){
        stockList.push({
          ...item,
          ref: stockRef,
          count,
          reserved,
          available
        });
      }
    }

    const totalAvailable = stockList.reduce(
      (total, item) => total + item.available,
      0
    );

    if(totalAvailable <= 0){
      return null;
    }

    let randomNumber =
      Math.floor(Math.random() * totalAvailable);

    let selected = null;

    for(const item of stockList){

      if(randomNumber < item.available){
        selected = item;
        break;
      }

      randomNumber -= item.available;
    }

    if(!selected){
      return null;
    }

    transaction.update(selected.ref, {
      reserved: selected.reserved + 1
    });

    return {
      id: selected.id,
      name: selected.name
    };
  });
}
/* ▼ 激熱バナー */
async function checkHot(id){
  const stock = await getStock(id);
  const b = document.getElementById("hotBanner");

  if(stock<=10 && stock>5){
    b.textContent="🔥 激熱チャンス！残りわずか！ 🔥";
    b.style.display="block";
    setTimeout(()=>b.style.display="none",1500);
  } else if(stock<=5 && stock>1){
    b.textContent="🔥🔥 超激熱！残り5以下！ 🔥🔥";
    b.style.display="block";
    setTimeout(()=>b.style.display="none",2000);
  } else if(stock===1){
    b.textContent="✨✨ ラスト1！超プレミア！ ✨✨";
    b.style.display="block";
    setTimeout(()=>b.style.display="none",2500);
  }
}

/* ▼ 全演出非表示 */
function hideAllEffects(){
  document.getElementById("rouletteBox").style.display="none";
  document.getElementById("slotBox").style.display="none";
  document.querySelector(".roulettePointer").style.display="none";
  document.getElementById("rouletteCenter").style.display="none";
  document.getElementById("gachaEffect").style.display="none";
  document.getElementById("fukubikiEffect").style.display="none";
  document.getElementById("staffConfirm").style.display="none";
}
/* ▼ 紙吹雪 */
function launchConfetti(){

  document
    .querySelectorAll(".confetti")
    .forEach(item => item.remove());

  const colors = [
    "#ff1744",
    "#ffd600",
    "#00e676",
    "#2979ff",
    "#d500f9",
    "#ff9100"
  ];

  for(let i = 0; i < 140; i++){

    const confetti =
      document.createElement("div");

    confetti.className = "confetti";

    confetti.style.left =
      Math.random() * 100 + "vw";

    confetti.style.background =
      colors[
        Math.floor(
          Math.random() * colors.length
        )
      ];

    confetti.style.animationDuration =
      (2 + Math.random() * 2) + "s";

    confetti.style.animationDelay =
      (Math.random() * 0.8) + "s";

    document.body.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 5000);
  }
}

/* ▼ 豪華な抽選結果表示 */
function showPrizeResult(prize){

  const result =
    document.getElementById("result");

  result.innerHTML = `
    <div class="winnerResult">
      🎉 抽選結果 🎉
      <br>
      ${prize}
    </div>
  `;

  launchConfetti();
}
/* ▼ ルーレット */
function playRouletteVegas(prize){
  hideAllEffects();

  const wheel=document.getElementById("rouletteWheel");
  const center=document.getElementById("rouletteCenter");
  const result=document.getElementById("result");

  document.getElementById("rouletteBox").style.display="block";
  document.querySelector(".roulettePointer").style.display="block";
  result.innerHTML="🎰 ルーレット回転中…";

  const angles={
    "microSDカード":30,
    "ハイドロフラスク水筒":90,
    "付箋布バッグ":150,
    "microSD型メモ帳":210,
    "microSD型付箋":270,
    "景品終了":330
  };

  const target=angles[prize] ?? Math.floor(Math.random()*360);

  wheel.style.transition="none";
  wheel.style.transform="rotate(0deg)";
  wheel.style.boxShadow="none";
  center.style.display="none";

  setTimeout(()=>{
    wheel.style.transition="transform 4.5s cubic-bezier(0.05,0.9,0.1,1)";
    wheel.style.transform=`rotate(${360*8+target}deg)`;

    setTimeout(()=>{
      showPrizeResult(prize);
      document.getElementById("staffConfirm")
        .style.display = "inline-block";
      wheel.style.boxShadow="0 -35px 25px gold";
      center.textContent=prize;
      center.style.display="block";
    },4500);
  },50);
}

/* ▼ 派手なスロット */
function playSlotEffect(prize){

  hideAllEffects();

  const r1 = document.getElementById("reel1");
  const r2 = document.getElementById("reel2");
  const r3 = document.getElementById("reel3");
  const result = document.getElementById("result");

  document.getElementById("slotBox")
    .style.display = "flex";

  result.innerHTML =
    "🎰 スロット回転中…";

  const symbols = [
    "7",
    "BAR",
    "★",
    "💎",
    "🔥"
  ];

  /* ▼ リール回転開始 */
  function startReel(reel){

/* ▼ ガチャガチャ完全版 */
const prizeColorMap = {
  microSD: "red",
  bottle: "blue",
  tote: "green",
  memo500: "yellow",
  memo100: "white"
};

/* ▼ 派手なガチャガチャ */
function playGachagachaEffect(prize){

  hideAllEffects();

  const box =
    document.getElementById("gachaEffect");

  const machine =
    box.querySelector(".gachaMachine");

  const area =
    document.getElementById("gachaCapsules");

  const result =
    document.getElementById("result");

  box.style.display = "block";

  result.innerHTML =
    "🎯 ガチャ抽選中…";

  area.innerHTML = "";

  /* 景品ごとの色 */
  const prizeIdMap = {
    "microSDカード": "microSD",
    "ハイドロフラスク水筒": "bottle",
    "付箋布バッグ": "tote",
    "microSD型メモ帳": "memo500",
    "microSD型付箋": "memo100"
  };

  const winnerColor =
    prizeColorMap[
      prizeIdMap[prize]
    ] || "gray";


  /* ▼ カプセル生成 */
  const colors = [
    "red",
    "blue",
    "green",
    "gold",
    "orange",
    "purple",
    "pink",
    "white"
  ];

  for(let i = 0; i < 12; i++){

    const capsule =
      document.createElement("div");

    capsule.className =
      "capsule capsuleShuffle";

    capsule.style.background =
      colors[
        Math.floor(
          Math.random() * colors.length
        )
      ];

    capsule.style.left =
      (35 + Math.random() * 200) + "px";

    capsule.style.top =
      (35 + Math.random() * 190) + "px";

    /*
      カプセルごとに少しタイミングを
      ずらして動きをバラバラにする
    */
    capsule.style.animationDelay =
      (Math.random() * 0.25) + "s";

    area.appendChild(capsule);
  }


  /* ▼ 本体ブルブル開始 */
  machine.classList.add("gachaShake");


  /* =========================
     2.3秒後
     シャッフル停止
  ========================= */
  setTimeout(() => {

    machine.classList.remove(
      "gachaShake"
    );

    const capsules =
      area.querySelectorAll(".capsule");

    capsules.forEach(capsule => {

      capsule.classList.remove(
        "capsuleShuffle"
      );

    });

    result.innerHTML =
      "✨ カプセル決定！ ✨";

  }, 2300);


  /* =========================
     当選カプセルを落とす
  ========================= */
  setTimeout(() => {

    const capsules =
      area.querySelectorAll(".capsule");

    if(capsules.length === 0){
      showPrizeResult(prize);

      document
        .getElementById("staffConfirm")
        .style.display = "inline-block";

      return;
    }

    const winner =
      capsules[
        Math.floor(
          Math.random() *
          capsules.length
        )
      ];

    /* 当選景品の色へ */
    winner.style.background =
      winnerColor;

    winner.classList.add(
      "gachaWinnerCapsule"
    );

  }, 2700);


  /* =========================
     景品発表
  ========================= */
  setTimeout(() => {

    showPrizeResult(prize);

    document
      .getElementById("staffConfirm")
      .style.display =
        "inline-block";

  }, 3900);
}

function playFukubikiEffect(prize){

  setTimeout(() => {

      "garaSlowDown"
    );

      "garaStopShock"
    );

    result.innerHTML =
      "💥 ガタン！！ 💥";

  }, 3800);

/* ▼ entryNumber 自動採番（安全版） */
async function getNextEntryNumber(){
  const ref = doc(db,"meta_test","entryCounter");
  const next = await runTransaction(db, async (t)=>{
    const snap = await t.get(ref);
    const current = snap.exists()? snap.data().lastNumber : 0;
    const newNum = current + 1;
    t.set(ref,{lastNumber:newNum});
    return newNum;
  });
  return next;
}

/* ▼ 抽選ボタン */
document.getElementById("start").addEventListener("click", async () => {
  if(drawing){
    return;
  }

  drawing = true;

  document.getElementById("start").disabled = true;

  const selectedPrize = await reserveWeightedPrize();

  let prize = "";

  if(!selectedPrize){

    prize = "景品終了";
    currentPrize = "景品終了";
    currentStockId = "";

  }else{

    prize = selectedPrize.name;
    currentPrize = selectedPrize.name;
    currentStockId = selectedPrize.id;

    await checkHot(currentStockId);
  }

  playRandomEffect(prize);

  currentEntryNumber = await getNextEntryNumber();

  /* questionnaire.htmlから渡されたアンケート情報取得 */
  const surveyData =
    JSON.parse(
      sessionStorage.getItem("survey")
    ) || {};

  /* surveyコレクションへ保存 */
  currentSurveyDocRef = await addDoc(collection(db, "survey_test"), {
    ...surveyData,

    entryNumber: currentEntryNumber,
    prize,
    stockId: currentStockId,

    reserved:
      currentStockId !== "",

    confirmed: false,
    timestamp: new Date()
  });

  /* このブラウザでは抽選済みにする */
  sessionStorage.setItem("drawCompleted", "true");

  drawing = false;
});

/* ▼ スタッフ確認（パスワード無し） */
document.getElementById("staffConfirm")
  .addEventListener("click", async () => {

    if (!currentSurveyDocRef) {
      alert("抽選結果がまだ保存されていません。");
      return;
    }

    const button = document.getElementById("staffConfirm");

    button.disabled = true;
    button.textContent = "確認処理中...";

    try {
      if(currentStockId){

        const stockRef =
          doc(db, "stock_test", currentStockId);

        const confirmed =
          await runTransaction(db, async (transaction) => {

            const stockSnap =
              await transaction.get(stockRef);

            if(!stockSnap.exists()){
              return false;
            }

            const stockData = stockSnap.data();

            const count =
              Number(stockData.count || 0);

            const reserved =
              Number(stockData.reserved || 0);

            if(count <= 0 || reserved <= 0){
              return false;
            }

            transaction.update(stockRef, {
              count: count - 1,
              reserved: reserved - 1
            });

            return true;
          });

        if(!confirmed){
          throw new Error(
            "在庫の確定処理に失敗しました"
          );
        }
      }

      await updateDoc(currentSurveyDocRef, {
        confirmed: true,
        reserved: false,
        confirmedAt: new Date()
      });

      button.textContent = "確認済み";
      button.style.background = "#28a745";
      document.getElementById("retryTest")
      .style.display = "inline-block";

      alert(
        "景品のお渡しを確認しました（番号: " +
        currentEntryNumber +
        "）"
      );

    } catch (error) {
      console.error(error);

      button.disabled = false;
      button.textContent = "景品をお渡ししました";

      alert("確認処理に失敗しました。");
    }
  });
 /* ▼ テスト版：もう一度最初から */
